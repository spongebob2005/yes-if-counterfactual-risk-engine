<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>yes, if — Sandbox checkout</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #172335;
        background: #f4f7f6;
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main {
        width: min(440px, calc(100% - 40px));
        padding: 32px;
        border: 1px solid #dce6e3;
        border-radius: 20px;
        background: white;
        box-shadow: 0 18px 55px #17233512;
      }
      .brand { color: #087e6f; font-size: .9rem; font-weight: 750; letter-spacing: .03em; }
      h1 { margin: 22px 0 8px; font-size: 1.65rem; }
      p { color: #5b6874; line-height: 1.55; }
      .price { margin: 24px 0; color: #172335; font-size: 2rem; font-weight: 700; }
      .badge {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 999px;
        color: #78560a;
        background: #fff5d9;
        font-size: .75rem;
        font-weight: 700;
        letter-spacing: .06em;
      }
      #paypal-button-container { margin-top: 22px; }
      #status { min-height: 1.5em; margin-top: 18px; font-size: .9rem; }
      .fine-print { margin-top: 24px; font-size: .78rem; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">SANDBOX · NO REAL CHARGES</span>
      <p class="brand">yes, if</p>
      <h1 id="product-name">Loading checkout…</h1>
      <p>A fixed-price test purchase. The amount is set by the server and cannot be changed in the browser.</p>
      <div class="price" id="price"></div>
      <div id="paypal-button-container"></div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="fine-print">Sandbox checkout only. The prototype risk score does not decide or execute this payment.</p>
    </main>
    <script>
      const statusNode = document.getElementById("status");
      const setStatus = (message) => { statusNode.textContent = message; };
      const requestJson = async (url, options = {}) => {
        const response = await fetch(url, {
          ...options,
          headers: { "Content-Type": "application/json", ...options.headers },
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || "The checkout request failed.");
        return payload;
      };

      async function startCheckout() {
        try {
          const config = await requestJson("/api/config");
          document.getElementById("product-name").textContent = config.product_name;
          document.getElementById("price").textContent = `${config.currency} ${config.amount}`;
          if (!config.client_id) {
            setStatus("Add PayPal sandbox credentials to .env, then restart the checkout server.");
            return;
          }

          const sdk = document.createElement("script");
          sdk.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(config.client_id)}&currency=${encodeURIComponent(config.currency)}&intent=capture&components=buttons`;
          sdk.onload = () => {
            window.paypal.Buttons({
              createOrder: async () => {
                setStatus("Creating your sandbox order…");
                const order = await requestJson("/api/orders", { method: "POST" });
                return order.id;
              },
              onApprove: async (data) => {
                setStatus("Confirming approval and capturing in the sandbox…");
                const result = await requestJson(
                  `/api/orders/${encodeURIComponent(data.orderID)}/capture`,
                  { method: "POST" },
                );
                setStatus(
                  result.status === "COMPLETED"
                    ? "Sandbox payment completed. No real funds were moved."
                    : `Sandbox payment status: ${result.status}.`,
                );
              },
              onCancel: () => setStatus("Checkout was cancelled. No payment was captured."),
              onError: (error) => {
                console.error("PayPal sandbox checkout failed", error);
                setStatus("Checkout failed. No success was reported; please retry.");
              },
            }).render("#paypal-button-container");
          };
          sdk.onerror = () => setStatus("Could not load PayPal's sandbox checkout.");
          document.head.appendChild(sdk);
        } catch (error) {
          setStatus(error.message || "Checkout configuration could not be loaded.");
        }
      }

      startCheckout();
    </script>
  </body>
</html>
