<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>yes, if - Sandbox checkout</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f3f7f6;
        --surface: #fbfdfc;
        --ink: #172335;
        --muted: #536575;
        --line: #d7e2df;
        --accent: #0b927b;
        --accent-strong: #07594f;
        --accent-soft: #e2f1ed;
        --warning: #73531b;
        --warning-soft: #fff5d9;
        --success: #07594f;
        --success-soft: #e2f1ed;
        --radius-surface: 14px;
        --radius-control: 8px;
        font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: var(--page);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 0; background: var(--page); }
      main {
        width: min(440px, calc(100% - 40px));
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: var(--radius-surface);
        background: var(--surface);
        box-shadow: 0 18px 55px #193e3512;
      }
      .brand { margin: 21px 0 0; color: var(--accent-strong); font-size: .92rem; font-weight: 800; letter-spacing: .02em; }
      h1 { margin: 8px 0 10px; font-size: clamp(1.55rem, 6vw, 1.85rem); letter-spacing: -.04em; line-height: 1.15; }
      p { color: var(--muted); line-height: 1.6; }
      .price { margin: 22px 0; color: var(--ink); font-size: 2.25rem; font-weight: 760; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
      .badge {
        display: inline-block;
        padding: 6px 9px;
        border: 1px solid #bbdcd3;
        border-radius: var(--radius-control);
        color: var(--accent-strong);
        background: var(--accent-soft);
        font-size: .72rem;
        font-weight: 800;
        letter-spacing: .04em;
      }
      #paypal-button-container { margin-top: 24px; }
      #status {
        min-height: 3.2em;
        margin-top: 18px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: var(--radius-control);
        background: var(--page);
        color: var(--muted);
        font-size: .88rem;
      }
      #status[data-state="success"] { border-color: #bbdcd3; background: var(--success-soft); color: var(--success); }
      #status[data-state="warning"] { border-color: #d9c994; background: var(--warning-soft); color: var(--warning); }
      #status[data-state="error"] { border-color: #d6a6a0; background: #fff0ed; color: #7b3028; }
      #status[data-state="info"] { border-color: #bbdcd3; background: var(--accent-soft); color: var(--accent-strong); }
      .fine-print { margin-top: 22px; font-size: .8rem; }
      :focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #101a20;
          --surface: #17252c;
          --ink: #edf5f2;
          --muted: #b0c0c3;
          --line: #2a3d42;
          --accent: #65c6ae;
          --accent-strong: #75d6bd;
          --accent-soft: #193b36;
          --warning: #f0cf7c;
          --warning-soft: #3a3320;
          --success: #c5eee2;
          --success-soft: #193b36;
        }
        #status[data-state="error"] { border-color: #784a43; background: #382624; color: #ffd0c9; }
        :focus-visible { outline-color: var(--accent-strong); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">SANDBOX | NO REAL CHARGES</span>
      <p class="brand">yes, if</p>
      <h1 id="product-name">Loading checkout…</h1>
      <p>A fixed-price test purchase. The amount is set by the server and cannot be changed in the browser.</p>
      <div class="price" id="price"></div>
      <div id="paypal-button-container"></div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="fine-print">Sandbox checkout only. The prototype risk score does not decide or execute this payment.</p>
    </main>
    <script>
      const statusNode = document.getElementById("status");
      const setStatus = (message, state = "info") => {
        statusNode.textContent = message;
        statusNode.dataset.state = state;
      };
      const requestJson = async (url, options = {}) => {
        const response = await fetch(url, {
          ...options,
          headers: { "Content-Type": "application/json", ...options.headers },
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || "The checkout request failed.");
        return payload;
      };

      async function startCheckout() {
        try {
          const config = await requestJson("/api/config");
          document.getElementById("product-name").textContent = config.product_name;
          document.getElementById("price").textContent = `${config.currency} ${config.amount}`;
          if (!config.client_id) {
            setStatus("Add PayPal sandbox credentials to .env, then restart the checkout server.", "warning");
            return;
          }

          const sdk = document.createElement("script");
          sdk.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(config.client_id)}&currency=${encodeURIComponent(config.currency)}&intent=capture&components=buttons`;
          sdk.onload = () => {
            window.paypal.Buttons({
              createOrder: async () => {
                setStatus("Creating your sandbox order...");
                const order = await requestJson("/api/orders", { method: "POST" });
                return order.id;
              },
              onApprove: async (data) => {
                setStatus("Confirming approval and capturing in the sandbox...");
                const result = await requestJson(
                  `/api/orders/${encodeURIComponent(data.orderID)}/capture`,
                  { method: "POST" },
                );
                setStatus(
                  result.status === "COMPLETED"
                    ? "Sandbox payment completed. No real funds were moved."
                    : `Sandbox payment status: ${result.status}.`,
                  result.status === "COMPLETED" ? "success" : "warning",
                );
              },
              onCancel: () => setStatus("Checkout was cancelled. No payment was captured.", "warning"),
              onError: (error) => {
                console.error("PayPal sandbox checkout failed", error);
                setStatus("Checkout failed. No success was reported; please retry.", "error");
              },
            }).render("#paypal-button-container");
          };
          sdk.onerror = () => setStatus("Could not load PayPal's sandbox checkout.", "error");
          document.head.appendChild(sdk);
        } catch (error) {
          setStatus(error.message || "Checkout configuration could not be loaded.", "error");
        }
      }

      startCheckout();
    </script>
  </body>
</html>
